<!DOCTYPE html>
<!-- 羽力训练 BadmintonFit：纯本地零依赖静态 PWA，经典 script（非 module） -->
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover 适配刘海屏/手势条安全区 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0F">
  <title>羽力训练</title>
  <link rel="manifest" href="manifest.json">
  <!-- 内联空图标，避免 file:// 下 404 报错 -->
  <link rel="icon" href="data:,">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <!-- 顶栏：标题 + 主题切换（按钮触控区 ≥48px） -->
  <header class="topbar">
    <div class="topbar-title">
      <h1>羽力训练</h1>
      <span class="topbar-sub">BadmintonFit</span>
    </div>
    <button id="theme-btn" class="theme-btn" type="button" aria-label="切换深浅主题">
      <!-- 太阳（浅色模式显示） -->
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <!-- 月亮（深色模式显示，默认） -->
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
    </button>
  </header>

  <!-- 主视图：四个页面 section，默认隐藏，由 app.js 通过 .active 切换 -->
  <main id="view">
    <section class="page" id="page-today">
      <div id="today-root"></div>
    </section>
    <section class="page" id="page-plan">
      <div id="planner-root"></div>
      <div id="sync-root"></div>
    </section>
    <section class="page" id="page-library">
      <div id="library-root"></div>
    </section>
    <section class="page" id="page-progress">
      <div id="progress-root"></div>
    </section>
  </main>

  <!-- 底部导航：4 个等分按钮，触控目标 ≥48px -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="today" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>
      </svg>
      <span>今日</span>
    </button>
    <button class="nav-item" data-page="plan" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 6h10M4 12h10M4 18h6"/><path d="M17 13v8M13 17h8"/>
      </svg>
      <span>制定</span>
    </button>
    <button class="nav-item" data-page="library" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      <span>动作库</span>
    </button>
    <button class="nav-item" data-page="progress" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 21h18"/><path d="M6 21v-8M12 21V5M18 21v-11"/>
      </svg>
      <span>进度</span>
    </button>
  </nav>

  <!-- 全屏跟练容器（由 js/player.js 填充，默认隐藏） -->
  <div id="player-root" hidden></div>
  <!-- 模态框挂载点 -->
  <div id="modal-root"></div>
  <!-- Toast 挂载点 -->
  <div id="toast-root"></div>

  <!-- 脚本：顺序加载（均 defer）；?v=3 为缓存版本号——更新文件后务必递增，避免浏览器 HTTP 缓存拿到旧版 -->
  <script defer src="js/store.js?v=3"></script>
  <script defer src="js/data.js?v=3"></script>
  <script defer src="js/vendor/qrcode.min.js?v=3"></script>
  <script defer src="js/vendor/jsqr.min.js?v=3"></script>
  <script defer src="js/app.js?v=3"></script>
  <script defer src="js/planner.js?v=3"></script>
  <script defer src="js/library.js?v=3"></script>
  <script defer src="js/player.js?v=3"></script>
  <script defer src="js/sync.js?v=3"></script>
  <script defer src="js/progress.js?v=3"></script>
</body>
</html>
